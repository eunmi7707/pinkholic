<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주문서 - 핑크홀릭</title>
<link rel="stylesheet" href="style.css">

<style>
  /* 이 페이지에서만 쓰는 디자인 */

  .order-box {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* 주문서의 칸 하나 (주문 상품 / 배송지 / 결제 수단) */
  .order-section {
    background-color: white;
    border: 1px solid #ecd9e0;
    border-radius: 4px;
    padding: 26px 28px 8px 28px;
    margin-bottom: 18px;
  }
  .order-section h3 {
    font-size: 18px;
    font-weight: normal;
    color: #3f2c33;
    margin: 0 0 18px 0;
  }

  /* 주문 상품 한 줄 */
  .order-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 0;
    border-top: 1px solid #f5e9ee;
  }
  .order-item:first-of-type {
    border-top: none;
    padding-top: 0;
  }
  .order-item img {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .order-item .info {
    flex: 1;
    min-width: 0;
  }
  .order-item .count {
    font-size: 14px;
    color: #a1909a;
    margin-top: 4px;
  }
  .order-item .sum {
    color: #3f2c33;
    font-weight: bold;
    white-space: nowrap;
  }
  .order-section .items {
    padding-bottom: 18px;
  }

  /* 주소 칸은 우편번호를 짧게 */
  .field .postcode {
    max-width: 180px;
    margin-bottom: 8px;
  }
  .field .address-line {
    margin-bottom: 8px;
  }
  .field select {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid #e3c9d4;
    border-radius: 3px;
    background-color: white;
    box-sizing: border-box;
  }
  #memoText {
    margin-top: 8px;
    display: none;
  }

  /* 결제 수단 : 누르는 버튼 모양 */
  .pay-methods {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .pay-methods label {
    flex: 1 1 140px;
    border: 1px solid #e3c9d4;
    border-radius: 3px;
    padding: 14px 10px;
    text-align: center;
    cursor: pointer;
    color: #6b5560;
  }
  .pay-methods input {
    display: none;
  }
  .pay-methods label.on {
    border-color: #b9557a;
    color: #b9557a;
    font-weight: bold;
    background-color: #fff3f7;
  }
  .pay-note {
    font-size: 13px;
    color: #a1909a;
    margin: 12px 0 18px 0;
  }

  /* 동의 */
  .agree {
    margin-top: 22px;
    font-size: 15px;
    text-align: center;
  }
  .agree label {
    cursor: pointer;
  }
  .agree .error {
    display: none;
    font-size: 13px;
    color: #e0356f;
    margin-top: 8px;
  }
  .agree.wrong .error {
    display: block;
  }

  /* 로그인이 필요하거나 장바구니가 비었을 때 */
  .order-box .empty {
    background-color: white;
    border: 1px solid #ecd9e0;
    border-radius: 4px;
  }

  /* ===== 휴대폰 화면 ===== */
  @media (max-width: 620px) {
    .order-box {
      padding: 0 14px;
    }
    .order-section {
      padding: 20px 18px 4px 18px;
    }
    .order-item img {
      width: 56px;
      height: 56px;
    }
    .order-item .info {
      font-size: 15px;
    }
    .field select {
      font-size: 16px;   /* 16px 보다 작으면 아이폰에서 화면이 확대됩니다 */
    }
  }
</style>
</head>

<body>

<!-- 맨 위 -->
<header>
  <h1><a href="index.html">PINKHOLIC</a></h1>
  <p>매일의 나를 조금 더 빛나게, 어른을 위한 감성 잡화</p>
</header>

<!-- 메뉴 -->
<nav>
  <a href="index.html">전체상품</a>
  <a href="cart.html">장바구니<span id="cartCount">0</span></a>
  <a href="mypage.html">마이페이지</a>
  <a href="join.html" id="joinLink">회원가입</a>
  <a href="login.html" id="loginLink">로그인</a>
</nav>

<!-- 페이지 제목 -->
<h2 class="section-title">ORDER</h2>
<p class="section-title-sub" style="margin-bottom: 40px;">주문하실 상품과 배송지를 확인해 주세요</p>

<!-- 주문서 (자바스크립트가 채웁니다) -->
<div class="order-box" id="orderBox"></div>

<div class="bottom-space"></div>

<!-- 맨 아래: 연락처 -->
<footer>
  <div>고객센터 010-123-4567 &nbsp;|&nbsp; 평일 10:00 ~ 18:00 (주말·공휴일 휴무)</div>
  <div>이메일 help@pinkholic.com &nbsp;|&nbsp; 카카오톡 채널 @핑크홀릭</div>
  <div>교환 · 반품은 받으신 날부터 7일 이내 가능합니다.</div>
  <div>&copy; 2026 PINKHOLIC</div>
</footer>

<script src="products.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script src="supabase.js"></script>
<script>
  // 한 칸에 대해 "틀림" 표시를 켜고 끕니다.
  function mark(fieldId, isWrong) {
    var box = document.getElementById(fieldId);
    if (isWrong) {
      box.classList.add("wrong");
    } else {
      box.classList.remove("wrong");
    }
    return !isWrong;   // 통과했으면 true
  }

  // 주문서를 화면에 그립니다.
  function drawOrder() {
    var box = document.getElementById("orderBox");
    var user = getLoginUser();
    var cart = getCart();

    // 로그인하지 않았을 때
    if (!user) {
      box.innerHTML =
        '<div class="empty">주문하시려면 로그인이 필요합니다.' +
        '<br><a href="login.html?next=order.html">로그인하기</a></div>';
      return;
    }

    // 주문 상품 목록
    var itemsHtml = "";
    var itemCount = 0;
    for (var i = 0; i < cart.length; i++) {
      var item = findProduct(cart[i].id);
      if (!item) {
        continue;   // 목록에서 사라진 상품은 건너뜁니다.
      }
      itemCount++;
      itemsHtml +=
        '<div class="order-item">' +
          '<img src="' + item.img + '" alt="' + item.name + '">' +
          '<div class="info">' +
            '<div>' + item.name + '</div>' +
            '<div class="count">' + won(item.price) + ' × ' + cart[i].count + '개</div>' +
          '</div>' +
          '<div class="sum">' + won(item.price * cart[i].count) + '</div>' +
        '</div>';
    }

    // 장바구니가 비었을 때
    if (itemCount === 0) {
      box.innerHTML =
        '<div class="empty">주문할 상품이 없습니다.<br>장바구니에 상품을 담아주세요.' +
        '<br><a href="index.html">상품 보러 가기</a></div>';
      return;
    }

    box.innerHTML =
      // 1) 주문 상품
      '<div class="order-section">' +
        '<h3>주문 상품 (' + itemCount + '개)</h3>' +
        '<div class="items">' + itemsHtml + '</div>' +
      '</div>' +

      // 2) 배송지
      '<div class="order-section">' +
        '<h3>배송지</h3>' +
        '<div class="field" id="fieldName">' +
          '<label>받는 분 <span class="star">*</span></label>' +
          '<input type="text" id="shipName" placeholder="홍길동">' +
          '<div class="error">받는 분 이름을 입력해 주세요.</div>' +
        '</div>' +
        '<div class="field" id="fieldPhone">' +
          '<label>휴대폰 번호 <span class="star">*</span></label>' +
          '<input type="text" id="shipPhone" placeholder="010-1234-5678">' +
          '<div class="error">010-1234-5678 형식으로 입력해 주세요.</div>' +
        '</div>' +
        '<div class="field" id="fieldAddress">' +
          '<label>주소 <span class="star">*</span></label>' +
          '<input type="text" class="postcode" id="shipPostcode" placeholder="우편번호 5자리">' +
          '<input type="text" class="address-line" id="shipAddress" placeholder="기본 주소 (도로명 또는 지번)">' +
          '<input type="text" id="shipDetail" placeholder="상세 주소 (동·호수)">' +
          '<div class="error" id="addressError">주소를 입력해 주세요.</div>' +
        '</div>' +
        '<div class="field">' +
          '<label>배송 메모</label>' +
          '<select id="memoSelect" onchange="changeMemo()">' +
            '<option value="">선택하지 않음</option>' +
            '<option>문 앞에 놓아주세요</option>' +
            '<option>경비실에 맡겨주세요</option>' +
            '<option>배송 전에 연락 부탁드립니다</option>' +
            '<option value="direct">직접 입력</option>' +
          '</select>' +
          '<input type="text" id="memoText" placeholder="배송 기사님께 전할 말 (30자까지)" maxlength="30">' +
        '</div>' +
      '</div>' +

      // 3) 결제 수단
      '<div class="order-section">' +
        '<h3>결제 수단</h3>' +
        '<div class="pay-methods" id="payMethods">' +
          '<label class="on"><input type="radio" name="pay" value="card" checked onchange="changePay()">신용카드</label>' +
          '<label><input type="radio" name="pay" value="bank" onchange="changePay()">무통장 입금</label>' +
          '<label><input type="radio" name="pay" value="kakao" onchange="changePay()">카카오페이</label>' +
        '</div>' +
        '<div class="pay-note" id="payNote"></div>' +
      '</div>' +

      // 4) 결제 금액 (로그인한 회원이므로 회원 할인이 들어갑니다)
      totalBoxHtml(calcTotals(cart, true), true, "최종 결제 금액") +

      // 5) 동의와 결제 버튼
      '<div class="agree" id="fieldAgree">' +
        '<label><input type="checkbox" id="orderAgree"> 주문 내용을 확인했으며 결제에 동의합니다 <span class="star">*</span></label>' +
        '<div class="error">주문 내용 확인에 동의해 주세요.</div>' +
      '</div>' +
      '<div class="order-row">' +
        '<button class="main-btn" id="payBtn" onclick="pay()">' + won(calcTotals(cart, true).pay) + ' 결제하기</button>' +
      '</div>';

    // 회원 정보로 받는 분과 휴대폰을 미리 채워 둡니다.
    document.getElementById("shipName").value = user.name || "";
    document.getElementById("shipPhone").value = user.phone || "";
    changePay();
  }

  // 배송 메모에서 "직접 입력"을 고르면 입력 칸을 보여줍니다.
  function changeMemo() {
    var direct = document.getElementById("memoSelect").value === "direct";
    document.getElementById("memoText").style.display = direct ? "block" : "none";
  }

  // 고른 결제 수단을 표시하고 안내 문구를 바꿉니다.
  function changePay() {
    var notes = {
      card: "다음 단계에서 카드사 결제 창이 열립니다.",
      bank: "주문 후 안내해 드리는 계좌로 3일 안에 입금해 주세요.",
      kakao: "다음 단계에서 카카오페이 결제 창이 열립니다."
    };
    var labels = document.getElementById("payMethods").getElementsByTagName("label");
    var chosen = "card";
    for (var i = 0; i < labels.length; i++) {
      var radio = labels[i].getElementsByTagName("input")[0];
      if (radio.checked) {
        labels[i].classList.add("on");
        chosen = radio.value;
      } else {
        labels[i].classList.remove("on");
      }
    }
    document.getElementById("payNote").textContent = notes[chosen];
  }

  // 결제하기 : 입력한 내용을 확인합니다.
  function pay() {
    var name = document.getElementById("shipName").value.trim();
    var phone = document.getElementById("shipPhone").value.trim();
    var postcode = document.getElementById("shipPostcode").value.trim();
    var address = document.getElementById("shipAddress").value.trim();
    var ok = true;

    if (!mark("fieldName", name === "")) {
      ok = false;
    }
    if (!mark("fieldPhone", !/^01[0-9]-?\d{3,4}-?\d{4}$/.test(phone))) {
      ok = false;
    }

    // 주소 : 우편번호 5자리와 기본 주소가 있어야 합니다.
    var addressError = document.getElementById("addressError");
    if (!/^\d{5}$/.test(postcode)) {
      addressError.textContent = "우편번호 5자리를 숫자로 입력해 주세요.";
      mark("fieldAddress", true);
      ok = false;
    } else if (address === "") {
      addressError.textContent = "기본 주소를 입력해 주세요.";
      mark("fieldAddress", true);
      ok = false;
    } else {
      mark("fieldAddress", false);
    }

    var agreeBox = document.getElementById("fieldAgree");
    if (document.getElementById("orderAgree").checked) {
      agreeBox.classList.remove("wrong");
    } else {
      agreeBox.classList.add("wrong");
      ok = false;
    }

    // 틀린 곳이 있으면 그 칸이 보이도록 올라갑니다.
    if (!ok) {
      document.querySelector(".wrong").scrollIntoView({ block: "center" });
      return;
    }

    alert("주문서 입력이 모두 끝났습니다.\n아직 결제 서비스가 연결되어 있지 않아 실제 결제는 되지 않습니다.");
  }

  window.onload = function () {
    updateNav();

    // Supabase 에서 상품을 불러온 뒤에 주문서를 그립니다.
    loadProducts(function (ok) {
      if (ok) {
        drawOrder();
      } else {
        showLoadError(document.getElementById("orderBox"));
      }
    });
  };
</script>

</body>
</html>
