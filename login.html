<!-- 맨 위 -->

<!-- 메뉴 -->
<nav>
  <a href="index.html">전체상품</a>
  <a href="cart.html">장바구니<span id="cartCount">0</span></a>

<!-- 페이지 제목 -->
<h2 class="section-title">LOGIN</h2>
<p class="section-title-sub" style="margin-bottom: 40px;">가입하신 이메일로 로그인해 주세요</p>

<!-- 로그인 양식 -->
<div class="form-box">

  <div class="field" id="fieldEmail">
    <label>이메일</label>
    <input type="text" id="loginEmail" placeholder="가입하신 이메일">
    <div class="error">이메일을 입력해 주세요.</div>
  </div>

  <div class="field" id="fieldPw">
    <label>비밀번호</label>
    <input type="password" id="loginPw" placeholder="비밀번호" onkeyup="pressEnter(event)">
    <div class="error" id="pwError">비밀번호를 입력해 주세요.</div>
  </div>

  <button class="submit-btn" id="loginBtn" onclick="login()">로그인</button>

</div>

<div class="under-form">
  아직 회원이 아니신가요? <a href="join.html">회원가입</a>
</div>

<div class="bottom-space"></div>

<!-- 맨 아래: 연락처 -->
<footer>
  <div>고객센터 010-123-4567 &nbsp;|&nbsp; 평일 10:00 ~ 18:00 (주말·공휴일 휴무)</div>
  <div>이메일 help@pinkholic.com &nbsp;|&nbsp; 카카오톡 채널 @핑크홀릭</div>
  <div>교환 · 반품은 받으신 날부터 7일 이내 가능합니다.</div>
  <div>&copy; 2026 PINKHOLIC</div>
</footer>

<script src="products.js?v=20261010-1532"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script src="supabase.js?v=20261010-1532"></script>
<script>
  // 한 칸에 대해 "틀림" 표시를 켜고 끕니다.
  function mark(fieldId, isWrong) {
    var box = document.getElementById(fieldId);
    if (isWrong) {
      box.classList.add("wrong");
    } else {
      box.classList.remove("wrong");
    }
  }

  // 비밀번호 칸에서 엔터를 누르면 바로 로그인합니다.
  function pressEnter(event) {
    if (event.keyCode === 13) {
      login();
    }
  }

  function login() {
    var email = document.getElementById("loginEmail").value.trim();
    var pw = document.getElementById("loginPw").value;
    var pwError = document.getElementById("pwError");

    // 빈 칸 확인
    mark("fieldEmail", email === "");
    pwError.textContent = "비밀번호를 입력해 주세요.";
    mark("fieldPw", pw === "");
    if (email === "" || pw === "") {
      return;
    }

    // Supabase에 확인합니다. 기다리는 동안 버튼을 잠급니다.
    var btn = document.getElementById("loginBtn");
    btn.disabled = true;
    btn.textContent = "확인하는 중...";

    signIn(email, pw, function (user, errorText) {
      btn.disabled = false;
      btn.textContent = "로그인";

      if (!user) {
        pwError.textContent = errorText;
        mark("fieldPw", true);
        return;
      }

      alert((user.name || user.email) + "님, 환영합니다.");

      // 주문하다가 로그인하러 왔으면 (login.html?next=order.html) 그 화면으로 돌아갑니다.
      // 다른 사이트로 보내지 않도록 이 사이트의 화면 이름만 받습니다.
      var next = getParam("next");
      location.href = /^[a-z]+\.html$/.test(next) ? next : "index.html";
    });
  }

  window.onload = function () {
    updateNav();

    // 이미 로그인한 상태라면 이메일을 채워 둡니다.
    var user = getLoginUser();
    if (user) {
      document.getElementById("loginEmail").value = user.email;
    }
  };
</script>

</body>
</html>
