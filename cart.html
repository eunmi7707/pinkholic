<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>장바구니 - 핑크홀릭</title>
<link rel="stylesheet" href="style.css">

<style>
  /* 이 페이지에서만 쓰는 디자인 */

  .cart-box {
    max-width: 900px;
    margin: 45px auto 0 auto;
    padding: 0 20px;
  }

  /* 장바구니 상품 한 줄 */
  .cart-item {
    display: flex;
    align-items: center;
    gap: 20px;
    background-color: white;
    border: 1px solid #ecd9e0;
    border-radius: 4px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .cart-item img {
    width: 96px;
    height: 96px;
    object-fit: cover;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .cart-item .info {
    flex: 1 1 160px;
    min-width: 0;
  }
  .cart-item .info a {
    color: #3f2c33;
    text-decoration: none;
    font-size: 17px;
  }
  .cart-item .unit {
    font-size: 14px;
    color: #a1909a;
    margin-top: 6px;
  }

  /* 수량 조절 */
  .count-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .count-btn {
    width: 32px;
    height: 32px;
    background-color: white;
    border: 1px solid #e3c9d4;
    color: #8d4260;
    font-size: 16px;
    cursor: pointer;
    border-radius: 3px;
  }
  .count-value {
    width: 34px;
    text-align: center;
    font-size: 16px;
  }

  /* 한 줄 합계 */
  .cart-item .sum {
    width: 120px;
    text-align: right;
    color: #b9557a;
    font-size: 18px;
    font-weight: bold;
  }
  .cart-item .del {
    background: none;
    border: none;
    color: #bda6b0;
    font-size: 20px;
    cursor: pointer;
    padding: 0 4px;
  }

  /* 결제 금액 */
  .total-box {
    background-color: white;
    border: 1px solid #ecd9e0;
    border-radius: 4px;
    padding: 26px 24px;
    margin-top: 26px;
  }
  .total-line {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    color: #6b5560;
  }
  .total-line.final {
    border-top: 1px solid #f0e2e8;
    margin-top: 12px;
    padding-top: 18px;
    font-size: 19px;
    color: #3f2c33;
  }
  .total-line.final b {
    color: #b9557a;
    font-size: 26px;
  }
  .order-row {
    text-align: center;
    margin-top: 26px;
  }
  .order-row .main-btn {
    width: 100%;
    max-width: 420px;
  }

  /* ===== 휴대폰 화면 ===== */
  @media (max-width: 620px) {
    .cart-box {
      margin-top: 26px;
      padding: 0 14px;
    }

    /* 사진은 왼쪽, 이름·수량·금액은 오른쪽에 세로로 */
    .cart-item {
      flex-wrap: wrap;
      gap: 14px;
      padding: 14px;
      position: relative;
    }
    .cart-item img {
      width: 78px;
      height: 78px;
    }
    .cart-item .info {
      flex: 1 1 0;
      padding-right: 26px;   /* 삭제 버튼 자리 */
    }
    .cart-item .info a {
      font-size: 15px;
    }
    /* 삭제 버튼은 오른쪽 위 구석으로 */
    .cart-item .del {
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 22px;
      padding: 4px 6px;
    }
    /* 수량과 금액을 아랫줄에 나란히 */
    .cart-item .count-row {
      order: 3;
    }
    .count-btn {
      width: 38px;
      height: 38px;
      font-size: 18px;
    }
    .cart-item .sum {
      order: 4;
      width: auto;
      margin-left: auto;
      font-size: 17px;
    }

    .total-box {
      padding: 20px 18px;
      margin-top: 18px;
    }
    .total-line {
      font-size: 15px;
    }
    .total-line.final {
      font-size: 17px;
    }
    .total-line.final b {
      font-size: 22px;
    }

    /* 주문 버튼을 화면 아래에 붙여둡니다 */
    .order-row {
      position: sticky;
      bottom: 0;
      background-color: #faf4f6;
      padding: 12px 0;
      margin-top: 18px;
    }
    .order-row .main-btn {
      padding: 16px 10px;
    }
  }
</style>
</head>

<body>

<!-- 맨 위 -->
<header>
  <h1><a href="index.html">PINKHOLIC</a></h1>
  <p>매일의 나를 조금 더 빛나게, 어른을 위한 감성 잡화</p>
</header>

<!-- 메뉴 -->
<nav>
  <a href="index.html">전체상품</a>
  <a href="cart.html" class="now">장바구니 (<span id="cartCount">0</span>)</a>
  <a href="mypage.html">마이페이지</a>
  <a href="join.html" id="joinLink">회원가입</a>
  <a href="login.html" id="loginLink">로그인</a>
</nav>

<!-- 페이지 제목 -->
<h2 class="section-title">CART</h2>
<p class="section-title-sub">담아두신 상품입니다</p>

<!-- 장바구니 내용 (자바스크립트가 채웁니다) -->
<div class="cart-box" id="cartBox"></div>

<div class="bottom-space"></div>

<!-- 맨 아래: 연락처 -->
<footer>
  <div>고객센터 010-123-4567 &nbsp;|&nbsp; 평일 10:00 ~ 18:00 (주말·공휴일 휴무)</div>
  <div>이메일 help@pinkholic.com &nbsp;|&nbsp; 카카오톡 채널 @핑크홀릭</div>
  <div>교환 · 반품은 받으신 날부터 7일 이내 가능합니다.</div>
  <div>&copy; 2026 PINKHOLIC</div>
</footer>

<script src="products.js"></script>
<script>
  var FREE_SHIP = 30000;   // 이 금액 이상이면 배송비 무료
  var SHIP_FEE  = 3000;    // 배송비

  // 장바구니를 화면에 그립니다.
  function drawCart() {
    var cart = getCart();
    var box = document.getElementById("cartBox");
    var goodsTotal = 0;

    // 비어 있을 때
    if (cart.length === 0) {
      box.innerHTML =
        '<div class="empty">장바구니가 비어 있습니다.<br>' +
        '마음에 드는 상품을 담아보세요.' +
        '<br><a href="index.html">상품 보러 가기</a></div>';
      return;
    }

    var html = "";

    for (var i = 0; i < cart.length; i++) {
      var item = findProduct(cart[i].id);
      if (!item) {
        continue;   // 목록에서 사라진 상품은 건너뜁니다.
      }

      var lineSum = item.price * cart[i].count;
      goodsTotal += lineSum;

      html +=
        '<div class="cart-item">' +
          '<a href="product.html?id=' + item.id + '">' +
            '<img src="' + item.img + '" alt="' + item.name + '">' +
          '</a>' +
          '<div class="info">' +
            '<a href="product.html?id=' + item.id + '">' + item.name + '</a>' +
            '<div class="unit">개당 ' + won(item.price) + '</div>' +
          '</div>' +
          '<div class="count-row">' +
            '<button class="count-btn" onclick="changeCount(' + item.id + ', -1)">-</button>' +
            '<span class="count-value">' + cart[i].count + '</span>' +
            '<button class="count-btn" onclick="changeCount(' + item.id + ', 1)">+</button>' +
          '</div>' +
          '<div class="sum">' + won(lineSum) + '</div>' +
          '<button class="del" onclick="removeItem(' + item.id + ')" title="빼기">&times;</button>' +
        '</div>';
    }

    // 배송비 계산
    var shipFee = (goodsTotal >= FREE_SHIP) ? 0 : SHIP_FEE;
    var shipText = (shipFee === 0) ? "무료" : won(shipFee);

    html +=
      '<div class="total-box">' +
        '<div class="total-line"><span>상품 금액</span><span>' + won(goodsTotal) + '</span></div>' +
        '<div class="total-line"><span>배송비 (3만원 이상 무료)</span><span>' + shipText + '</span></div>' +
        '<div class="total-line final"><span>결제 예정 금액</span><b>' + won(goodsTotal + shipFee) + '</b></div>' +
      '</div>' +
      '<div class="order-row">' +
        '<button class="main-btn" onclick="order()">주문하기</button>' +
      '</div>';

    box.innerHTML = html;
  }

  // 수량을 바꿉니다. 0이 되면 장바구니에서 뺍니다.
  function changeCount(id, amount) {
    var cart = getCart();
    var newCart = [];

    for (var i = 0; i < cart.length; i++) {
      if (cart[i].id === id) {
        cart[i].count = cart[i].count + amount;
        if (cart[i].count < 1) {
          continue;   // 0개가 되면 목록에서 뺍니다.
        }
      }
      newCart.push(cart[i]);
    }

    setCart(newCart);
    updateNav();
    drawCart();
  }

  // 상품을 장바구니에서 뺍니다.
  function removeItem(id) {
    var cart = getCart();
    var newCart = [];

    for (var i = 0; i < cart.length; i++) {
      if (cart[i].id !== id) {
        newCart.push(cart[i]);
      }
    }

    setCart(newCart);
    updateNav();
    drawCart();
  }

  // 주문하기 (연습용이라 실제 결제는 되지 않습니다)
  function order() {
    var user = getLoginUser();

    if (!user) {
      if (confirm("주문하시려면 로그인이 필요합니다.\n로그인 화면으로 이동할까요?")) {
        location.href = "login.html";
      }
      return;
    }

    alert("연습용 페이지라 실제 결제는 되지 않습니다.\n실제 주문을 받으려면 결제 서비스 연결이 필요합니다.");
  }

  window.onload = function () {
    updateNav();
    drawCart();
  };
</script>

</body>
</html>
