<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마이페이지 - 핑크홀릭</title>
<link rel="stylesheet" href="style.css">

<style>
  /* 이 페이지에서만 쓰는 디자인 */

  /* 내 정보 3칸 */
  .summary {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 22px;
    max-width: 900px;
    margin: 40px auto 0 auto;
    padding: 0 20px;
  }
  .summary-box {
    background-color: white;
    border: 1px solid #ecd9e0;
    border-radius: 4px;
    width: 270px;
    box-sizing: border-box;
    padding: 26px 20px;
    text-align: center;
  }
  .summary-box .label {
    font-size: 15px;
    color: #8a7079;
    margin-bottom: 10px;
  }
  .summary-box .value {
    font-size: 28px;
    color: #b9557a;
    font-weight: bold;
  }

  /* 회원 정보 상자 */
  .member-box {
    max-width: 856px;
    margin: 40px auto 0 auto;
    padding: 0 20px;
  }
  .member-inner {
    background-color: white;
    border: 1px solid #ecd9e0;
    border-radius: 4px;
    padding: 26px 28px;
  }
  .member-inner h3 {
    font-size: 17px;
    color: #b9557a;
    margin: 0 0 16px 0;
    font-weight: normal;
  }
  .member-line {
    display: flex;
    padding: 6px 0;
    font-size: 15px;
  }
  .member-line .key {
    width: 110px;
    color: #8a7079;
  }
  .member-line .val {
    color: #3f2c33;
  }
  .member-inner .buttons {
    margin-top: 20px;
  }
  .member-inner .buttons a {
    margin-right: 10px;
  }
</style>
</head>

<body>

<!-- 맨 위 -->
<header>
  <h1><a href="index.html">PINKHOLIC</a></h1>
  <p>매일의 나를 조금 더 빛나게, 어른을 위한 감성 잡화</p>
</header>

<!-- 메뉴 -->
<nav>
  <a href="index.html">전체상품</a>
  <a href="cart.html">장바구니 (<span id="cartCount">0</span>)</a>
  <a href="mypage.html" class="now">마이페이지</a>
  <a href="join.html" id="joinLink">회원가입</a>
  <a href="login.html" id="loginLink">로그인</a>
</nav>

<!-- 페이지 제목 -->
<h2 class="section-title">MY PAGE</h2>
<p class="section-title-sub" id="greeting">찜한 상품을 모아서 보실 수 있습니다</p>

<!-- 내 정보 3칸 -->
<div class="summary">
  <div class="summary-box">
    <div class="label">찜한 상품</div>
    <div class="value" id="wishCount">0</div>
  </div>
  <div class="summary-box">
    <div class="label">장바구니</div>
    <div class="value" id="cartValue">0</div>
  </div>
  <div class="summary-box">
    <div class="label">적립금</div>
    <div class="value">0원</div>
  </div>
</div>

<!-- 회원 정보 (자바스크립트가 채웁니다) -->
<div class="member-box" id="memberBox"></div>

<!-- 찜한 상품 -->
<h2 class="section-title">WISH LIST</h2>
<p class="section-title-sub">하트를 누른 상품입니다</p>

<div class="products" id="wishList"></div>

<!-- 맨 아래: 연락처 -->
<footer>
  <div>고객센터 010-123-4567 &nbsp;|&nbsp; 평일 10:00 ~ 18:00 (주말·공휴일 휴무)</div>
  <div>이메일 help@pinkholic.com &nbsp;|&nbsp; 카카오톡 채널 @핑크홀릭</div>
  <div>교환 · 반품은 받으신 날부터 7일 이내 가능합니다.</div>
  <div>&copy; 2026 PINKHOLIC</div>
</footer>

<script src="products.js"></script>
<script>
  // 로그인 상태와 회원 정보를 보여줍니다.
  function drawMember() {
    var user = getLoginUser();
    var member = getMember();
    var box = document.getElementById("memberBox");

    // 로그인하지 않았을 때
    if (!user) {
      box.innerHTML =
        '<div class="member-inner">' +
          '<h3>로그인이 필요합니다</h3>' +
          '<div>로그인하시면 회원 정보와 주문 내역을 보실 수 있습니다.</div>' +
          '<div class="buttons">' +
            '<a class="main-btn" href="login.html">로그인</a>' +
            '<a class="main-btn" href="join.html">회원가입</a>' +
          '</div>' +
        '</div>';
      return;
    }

    document.getElementById("greeting").textContent =
      user.name + "님, 안녕하세요. 찜한 상품과 회원 정보를 확인하실 수 있습니다.";

    box.innerHTML =
      '<div class="member-inner">' +
        '<h3>회원 정보</h3>' +
        '<div class="member-line"><span class="key">아이디</span><span class="val">' + member.id + '</span></div>' +
        '<div class="member-line"><span class="key">이름</span><span class="val">' + member.name + '</span></div>' +
        '<div class="member-line"><span class="key">이메일</span><span class="val">' + member.email + '</span></div>' +
        '<div class="member-line"><span class="key">휴대폰</span><span class="val">' + (member.phone || "-") + '</span></div>' +
        '<div class="member-line"><span class="key">가입일</span><span class="val">' + member.joinedAt + '</span></div>' +
      '</div>';
  }

  // 찜한 상품을 카드로 그립니다.
  function drawWish() {
    var wish = getWish();
    var box = document.getElementById("wishList");

    box.innerHTML = "";

    if (wish.length === 0) {
      box.innerHTML =
        '<div class="empty">아직 찜한 상품이 없습니다.<br>' +
        '마음에 드는 상품의 하트를 눌러보세요.' +
        '<br><a href="index.html">상품 보러 가기</a></div>';
    }

    for (var i = 0; i < wish.length; i++) {
      var item = findProduct(wish[i]);
      if (!item) {
        continue;   // 목록에서 사라진 상품은 건너뜁니다.
      }

      var card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<button class="wish on" onclick="clickWish(' + item.id + ')">♥</button>' +
        '<a class="photo-link" href="product.html?id=' + item.id + '">' +
          '<img class="photo" src="' + item.img + '" alt="' + item.name + '">' +
        '</a>' +
        '<div class="name"><a href="product.html?id=' + item.id + '">' + item.name + '</a></div>' +
        '<div class="old-price">' + won(item.oldPrice) + '</div>' +
        '<div class="price"><span class="rate">' + discountRate(item.oldPrice, item.price) + '%</span>' + won(item.price) + '</div>' +
        '<button onclick="clickCart(' + item.id + ')">장바구니 담기</button>';

      box.appendChild(card);
    }

    document.getElementById("wishCount").textContent = wish.length;
  }

  // 하트를 다시 누르면 찜을 해제하고 목록을 새로 그립니다.
  function clickWish(id) {
    toggleWishId(id);
    drawWish();
  }

  // 장바구니에 담습니다.
  function clickCart(id) {
    addToCart(id, 1);
    updateNav();
    document.getElementById("cartValue").textContent = cartTotalCount();
    alert(findProduct(id).name + "을(를) 장바구니에 담았습니다.");
  }

  window.onload = function () {
    updateNav();
    drawMember();
    drawWish();
    document.getElementById("cartValue").textContent = cartTotalCount();
  };
</script>

</body>
</html>
