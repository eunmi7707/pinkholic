<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상품 상세 - 핑크홀릭</title>
<link rel="stylesheet" href="style.css?v=20261010-1555">

<style>
  /* 이 페이지에서만 쓰는 디자인 */

  .detail {
    display: flex;
    flex-wrap: wrap;
    gap: 64px;
    max-width: 1160px;
    margin: 64px auto 0 auto;
    padding: 0 20px;
  }

  /* 왼쪽 : 사진 (웜 그레이 바탕 위 부드러운 그림자) */
  .detail-photo {
    flex: 7 1 460px;
  }
  .detail-photo img {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    background-color: #f4f3f0;
    box-shadow: 0 50px 90px -50px rgba(10, 10, 10, 0.4), 0 2px 10px rgba(10, 10, 10, 0.04);
    border-radius: 0;
    display: block;
  }

  /* 오른쪽 : 상품 정보 */
  .detail-info {
    flex: 5 1 360px;
    padding-top: 10px;
  }
  .detail-category {
    font-size: 12px;
    color: #7a5f33;
    letter-spacing: 0.3em;
  }
  .detail-name {
    font-family: "Noto Serif KR", serif;
    font-size: 34px;
    font-weight: 300;
    line-height: 1.35;
    margin: 14px 0 24px 0;
  }
  .detail-old {
    color: #a39e94;
    text-decoration: line-through;
    font-size: 14px;
  }
  .detail-price {
    color: #111111;
    font-family: "Cormorant Garamond", serif;
    font-size: 38px;
    font-weight: 500;
    letter-spacing: 0.02em;
    margin: 2px 0 28px 0;
  }
  .detail-price .rate {
    font-size: 15px;
  }
  .detail-desc {
    color: #55514a;
    line-height: 1.9;
    border-top: 1px solid #ecebe6;
    padding-top: 24px;
    margin-bottom: 24px;
  }

  /* 요약 3줄 */
  .detail-points {
    list-style: none;
    padding: 0;
    margin: 0 0 30px 0;
  }
  .detail-points li {
    font-size: 15px;
    color: #55514a;
    padding: 7px 0 7px 16px;
    position: relative;
  }
  .detail-points li:before {
    content: "·";
    position: absolute;
    left: 4px;
    color: #111111;
  }

  /* 수량 고르기 */
  .count-row {
    display: flex;
    align-items: center;
    gap: 14px;
    border-top: 1px solid #ecebe6;
    padding-top: 24px;
    margin-bottom: 26px;
  }
  .count-row .label {
    font-size: 15px;
  }
  .count-btn {
    width: 38px;
    height: 38px;
    background-color: white;
    border: 1px solid #dcd8d0;
    color: #7a5f33;
    font-size: 18px;
    cursor: pointer;
    border-radius: 0;
  }
  .count-value {
    width: 46px;
    text-align: center;
    font-size: 17px;
  }
  .count-sum {
    margin-left: auto;
    font-size: 17px;
  }
  .count-sum b {
    color: #111111;
    font-family: "Cormorant Garamond", serif;
    font-size: 26px;
    font-weight: 500;
  }

  /* 버튼 두 개 */
  .buy-row {
    display: flex;
    gap: 12px;
  }
  .buy-row .main-btn {
    flex: 1;
    text-align: center;
    padding: 17px 10px;
  }
  .buy-row .sub-btn {
    width: 62px;
    background-color: white;
    border: 1px solid #dcd8d0;
    color: #8e897f;
    font-size: 22px;
    border-radius: 0;
    cursor: pointer;
  }
  .buy-row .sub-btn.on {
    color: #0a0a0a;
    border-color: #0a0a0a;
  }

  /* 목록으로 돌아가기 */
  .back-row {
    max-width: 1000px;
    margin: 60px auto 0 auto;
    padding: 0 20px;
    text-align: center;
  }
  .back-row a {
    color: #111111;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-decoration: none;
    border-bottom: 1px solid #111111;
    padding-bottom: 4px;
  }

  /* 찾는 상품이 없을 때 */
  .not-found {
    text-align: center;
    padding: 90px 20px;
    color: #6b675f;
  }

  /* ===== 휴대폰 화면 ===== */
  @media (max-width: 560px) {
    .detail {
      gap: 24px;
      margin-top: 20px;
      padding: 0 16px;
    }
    .detail-name {
      font-size: 22px;
      margin: 8px 0 14px 0;
    }
    .detail-price {
      font-size: 26px;
      margin-bottom: 18px;
    }
    .detail-price .rate {
      font-size: 17px;
    }
    .detail-desc {
      font-size: 15px;
      line-height: 1.8;
      padding-top: 18px;
      margin-bottom: 18px;
    }
    .detail-points li {
      font-size: 14px;
    }

    /* 수량 : 합계를 아랫줄로 내려 넉넉하게 */
    .count-row {
      flex-wrap: wrap;
      padding-top: 18px;
      margin-bottom: 18px;
    }
    .count-btn {
      width: 42px;
      height: 42px;
      font-size: 20px;
    }
    .count-sum {
      width: 100%;
      margin-left: 0;
      margin-top: 12px;
      text-align: right;
    }

    /* 장바구니 버튼을 화면 아래에 붙여둡니다 */
    .buy-row {
      position: sticky;
      bottom: 0;
      background-color: #ffffff;
      padding: 12px 0;
      margin: 0 -2px;
    }
    .buy-row .main-btn {
      padding: 16px 8px;
      font-size: 16px;
    }
    .buy-row .sub-btn {
      width: 56px;
    }

    .back-row {
      margin-top: 34px;
    }
  }
</style>
</head>

<body>

<!-- 맨 위 -->
<header>
  <h1><a href="index.html">PINKHOLIC</a></h1>
  <p>매일의 나를 조금 더 빛나게, 어른을 위한 감성 잡화</p>
</header>

<!-- 메뉴 -->
<nav>
  <a href="index.html">전체상품</a>
  <a href="cart.html">장바구니<span id="cartCount">0</span></a>
  <a href="mypage.html">마이페이지</a>
  <a href="join.html" id="joinLink">회원가입</a>
  <a href="login.html" id="loginLink">로그인</a>
</nav>

<!-- 상품 내용 (자바스크립트가 채웁니다) -->
<div id="detailBox"></div>

<div class="back-row">
  <a href="index.html">&lt; 전체 상품 보기</a>
</div>

<div class="bottom-space"></div>

<!-- 맨 아래: 연락처 -->
<footer>
  <div>고객센터 010-123-4567 &nbsp;|&nbsp; 평일 10:00 ~ 18:00 (주말·공휴일 휴무)</div>
  <div>이메일 help@pinkholic.com &nbsp;|&nbsp; 카카오톡 채널 @핑크홀릭</div>
  <div>교환 · 반품은 받으신 날부터 7일 이내 가능합니다.</div>
  <div>&copy; 2026 PINKHOLIC</div>
</footer>

<script src="products.js?v=20261010-1555"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script src="supabase.js?v=20261010-1555"></script>
<script>
  var product = null;   // 지금 보고 있는 상품
  var count = 1;        // 수량

  // 화면을 그립니다.
  function drawDetail() {
    // 주소창의 ?id=3 에서 상품 번호를 읽어옵니다.
    var id = parseInt(getParam("id"), 10);
    product = findProduct(id);

    var box = document.getElementById("detailBox");

    // 없는 상품 번호로 들어온 경우
    if (!product) {
      box.innerHTML =
        '<div class="not-found">상품을 찾을 수 없습니다.<br><br>' +
        '<a class="main-btn" href="index.html">전체 상품 보기</a></div>';
      return;
    }

    document.title = product.name + " - 핑크홀릭";

    // 요약 3줄 만들기
    var pointsHtml = "";
    for (var i = 0; i < product.points.length; i++) {
      pointsHtml += "<li>" + product.points[i] + "</li>";
    }

    var heartClass = isWished(product.id) ? "sub-btn on" : "sub-btn";
    var heart = isWished(product.id) ? "♥" : "♡";

    box.innerHTML =
      '<div class="detail">' +

        '<div class="detail-photo">' +
          '<img src="' + product.img + '" alt="' + product.name + '">' +
        '</div>' +

        '<div class="detail-info">' +
          '<div class="detail-category">' + product.category + '</div>' +
          '<h2 class="detail-name">' + product.name + '</h2>' +

          '<div class="detail-old">' + won(product.oldPrice) + '</div>' +
          '<div class="detail-price">' +
            '<span class="rate">' + discountRate(product.oldPrice, product.price) + '% </span>' +
            won(product.price) +
          '</div>' +

          '<div class="detail-desc">' + product.desc + '</div>' +
          '<ul class="detail-points">' + pointsHtml + '</ul>' +

          '<div class="count-row">' +
            '<span class="label">수량</span>' +
            '<button class="count-btn" onclick="changeCount(-1)">-</button>' +
            '<span class="count-value" id="countValue">1</span>' +
            '<button class="count-btn" onclick="changeCount(1)">+</button>' +
            '<span class="count-sum">합계 <b id="sumValue">' + won(product.price) + '</b></span>' +
          '</div>' +

          '<div class="buy-row">' +
            '<button class="main-btn" onclick="clickCart()">장바구니 담기</button>' +
            '<button class="' + heartClass + '" id="wishBtn" onclick="clickWish()">' + heart + '</button>' +
          '</div>' +
        '</div>' +

      '</div>';
  }

  // 수량을 올리고 내립니다. (1개 아래로는 내려가지 않습니다)
  function changeCount(amount) {
    count = count + amount;
    if (count < 1) {
      count = 1;
    }
    document.getElementById("countValue").textContent = count;
    document.getElementById("sumValue").textContent = won(product.price * count);
  }

  // 장바구니에 담습니다.
  function clickCart() {
    addToCart(product.id, count);
    updateNav();
    if (confirm(product.name + " " + count + "개를 장바구니에 담았습니다.\n장바구니로 이동할까요?")) {
      location.href = "cart.html";
    }
  }

  // 찜하기
  function clickWish() {
    var nowOn = toggleWishId(product.id);
    var btn = document.getElementById("wishBtn");
    if (nowOn) {
      btn.classList.add("on");
      btn.textContent = "♥";
    } else {
      btn.classList.remove("on");
      btn.textContent = "♡";
    }
  }

  window.onload = function () {
    updateNav();

    // Supabase 에서 상품을 불러온 뒤에 화면을 그립니다.
    loadProducts(function (ok) {
      if (ok) {
        drawDetail();
      } else {
        showLoadError(document.getElementById("detailBox"));
      }
    });
  };
</script>

</body>
</html>
